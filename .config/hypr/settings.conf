#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && waybar
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'capitaine-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 16
exec-once = gammastep
exec-once = wl-paste --type text --watch bash -c 'cliphist store && cliphist list | tail -n +501 | cliphist delete'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && cliphist list | tail -n +501 | cliphist delete'
exec-once = hyprpaper

exec-once = /home/baselash/.config/hypr/scripts/wall-sync
exec-once = /home/baselash/.config/hypr/scripts/auto_packages --backup
exec-once = /opt/activitywatch/aw-server/aw-server
exec-once = aw-awatcher

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 1

    col.active_border = rgba(89DDFFFF)
    col.inactive_border = rgba(BB5100FF)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 1
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false 
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = false # Fast hardware performance profile

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true 
}

master {
    new_on_top = true
}

misc {
    force_default_wallpaper = 1 
    disable_hyprland_logo = true 
}

#############
### INPUT ###
#############
input {
    kb_layout = us, ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

device {
    name = instant-usb-optical-mouse
    sensitivity = -0.7
}
device {
    name = usb-optical-mouse-
    sensitivity = -0.5
}
device {
    name = compx-2.4g-receiver-1
    sensitivity = -0.5
}
device {
    name = synps/2-synaptics-touchpad
    sensitivity = 0.2
}
