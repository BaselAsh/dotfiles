###################
### KEYBINDINGS ###
###################
$mainMod = SUPER 

# Program Shortcuts
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$zen-browser = zen-browser
$qute = qutebrowser

# Earbuds scripts
bind = SUPER, F2, exec, /home/baselash/.config/commands/cut-ears.py
bind = SUPER, F3, exec, /home/baselash/.config/commands/ears.py

# Screenshots
bind = $mainMod, s, exec, ~/.config/hypr/scripts/hypr-screenshot active
bind = $mainMod SHIFT, s, exec, ~/.config/hypr/scripts/hypr-screenshot area

# System toggles
bind = $mainMod, B, exec, killall -SIGUSR1 waybar
bind = $mainMod Shift, B, exec, killall waybar && waybar
bind = $mainMod SHIFT, N, exec, pkill gammastep || gammastep

# Clipboard Manager
bind = $mainMod, semicolon, exec, cliphist list | ~/.config/hypr/scripts/cliphist-rofi-img | rofi -dmenu -p "Clipboard" -show-icons -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy

# Function keys
bind = , XF86Calculator, exec, qalculate-gtk
bind = , XF86HomePage, exec, $zen-browser
bind = $mainMod, ESCAPE, exec, kitty btop 
bind = $mainMod, DELETE, exec, sleep 1 && systemctl suspend
bind = $mainMod, TAB, exec, rofi -show window
bind = $mainMod, BACKSLASH, exec, hyprlock
bind = $mainMod, GRAVE, exec, wlogout

# Journal rules
bind = $mainMod, T, exec, /home/baselash/.config/hypr/scripts/insert_todo
bind = $mainMod SHIFT, T, exec, [size 60% 70%; float; center;] kitty -e nvim /home/baselash/Workspace/Journal/todo.md
bind = $mainMod Shift, P, exec, [size 60% 70%; float; center;] kitty -e nvim /home/baselash/Workspace/Journal/projects.md
bind = $mainMod, N, exec, [size 60% 70%; float; center;] kitty -e nvim 

# Media Control
bind = , XF86AudioPlay, exec, mpc toggle
bind = , XF86AudioStop, exec, mpc stop
bind = , XF86AudioNext, exec, mpc next
bind = , XF86AudioPrev, exec, mpc prev
bind = , XF86Tools, exec, [size 60% 70%; float; center;] kitty -T "ncmpcpp-float" ncmpcpp
bind = , XF86Tools, exec, kitty -T "cava-visualizer" cava
bind = , XF86Mail, exec, $zen-browser mail.google.com

bind = $mainMod Shift, return, exec, code
bind = $mainMod Shift, F5, exec, killall hyprpaper && hyprpaper
bind = $mainMod, period, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod Shift, escape, exec, ~/.config/hypr/scripts/toggle_mode

# Dev Workspace Workflows
bind = $mainMod CTRL, 1, workspace, 1
bind = $mainMod CTRL, 1, exec, pgrep -x kitty || kitty

bind = $mainMod CTRL, 2, workspace, 2
bind = $mainMod CTRL, 2, exec, pgrep -x nvim || kitty -e nvim

bind = $mainMod CTRL, 3, workspace, 3
bind = $mainMod CTRL, 3, exec, pgrep -x zen-browser || $zen-browser

bind = $mainMod CTRL, 4, workspace, 4
bind = $mainMod CTRL, 4, exec, pgrep -x "npm" || foot

bind = $mainMod CTRL, 5, workspace, 5
bind = $mainMod CTRL, 5, exec, pgrep -x psql || kitty -e psql

bind = $mainMod CTRL, 6, workspace, 6
bind = $mainMod CTRL, 6, exec, $fileManager

bind = $mainMod CTRL, 7, workspace, 7
bind = $mainMod CTRL, 7, exec, pgrep -x qpdfview || qpdfview

bind = $mainMod CTRL, 8, workspace, 8
bind = $mainMod CTRL, 8, exec, pgrep -x vesktop || vesktop

bind = $mainMod CTRL, 9, workspace, 9
bind = $mainMod CTRL, 9, exec, pgrep -x btop || kitty -e btop

bind = $mainMod CTRL, 0, workspace, 10
bind = $mainMod CTRL, 0, exec, [size 60% 70%; float; center;] kitty -T "ncmpcpp-float" ncmpcpp

# Core Management
bind = $mainMod, f, fullscreen, 1
bind = $mainMod, D, exec, ~/.config/hypr/scripts/rofi-ytdl

bind = $mainMod, return, exec, $terminal 
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, W, exec, $zen-browser
bind = $mainMod SHIFT, W, exec, $qute 
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Workspace Selectors
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Numpad
bind = $mainMod, KP_End,    workspace, 1
bind = $mainMod, KP_Down,   workspace, 2
bind = $mainMod, KP_Next,   workspace, 3
bind = $mainMod, KP_Left,   workspace, 4
bind = $mainMod, KP_Begin,  workspace, 5
bind = $mainMod, KP_Right,  workspace, 6
bind = $mainMod, KP_Home,   workspace, 7
bind = $mainMod, KP_Up,     workspace, 8
bind = $mainMod, KP_Prior,  workspace, 9
bind = $mainMod, KP_Insert, workspace, 10

# Move window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, right, movetoworkspace, 2
bind = $mainMod SHIFT, left, movetoworkspace, 1
bind = $mainMod SHIFT, up, movetoworkspace, e+1
bind = $mainMod SHIFT, down, movetoworkspace, e-1
bind = $mainMod SHIFT, l, movetoworkspace, 2
bind = $mainMod SHIFT, h, movetoworkspace, 1
bind = $mainMod SHIFT, k, movetoworkspace, e+1
bind = $mainMod SHIFT, j, movetoworkspace, e-1

# Scratchpad
bind = $mainMod, m, togglespecialworkspace, magic
bind = $mainMod SHIFT, m, movetoworkspace, special:magic

# Scroll/Drag
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness via Alt
bind = ALT, XF86AudioRaiseVolume, exec, brightnessctl set +5%
bind = ALT, XF86AudioLowerVolume, exec, brightnessctl set 5%-
